name: 构建速记 IPA

on:
  workflow_dispatch:
    inputs:
      signing:
        description: '签名方式（unsigned 可直接用 Sideloadly/AltStore 重签安装）'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - development

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选择本机最新 Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "未找到 Xcode，请更换 runner 镜像"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: 用 XcodeGen 重新生成标准工程
        run: |
          brew install xcodegen
          rm -rf QuickRemind.xcodeproj
          xcodegen generate --spec project.yml
          plutil -lint QuickRemind.xcodeproj/project.pbxproj
          xcodebuild -list -project QuickRemind.xcodeproj

      # ---------- 无签名路径：零配置，产出可用 Sideloadly 重签的 IPA ----------
      - name: 构建 App（无签名）
        if: inputs.signing == 'unsigned'
        run: |
          xcodebuild \
            -project QuickRemind.xcodeproj \
            -scheme QuickRemind \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=QuickRemind/QuickRemind.unsigned.entitlements \
            build

      - name: 打包无签名 IPA
        if: inputs.signing == 'unsigned'
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "构建产物中未找到 .app"
            exit 1
          fi
          mkdir -p staging/Payload
          cp -R "$APP" staging/Payload/
          (cd staging && zip -qry "$GITHUB_WORKSPACE/QuickRemind-unsigned.ipa" Payload)
          ls -lh QuickRemind-unsigned.ipa

      # ---------- 开发签名路径：需要配置 4 个 Secrets ----------
      - name: 校验签名密钥
        if: inputs.signing == 'development'
        env:
          CERT: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.CERT_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          missing=0
          for pair in "CERT:$CERT" "CERT_PASS:$CERT_PASS" "PROFILE:$PROFILE" "TEAM:$TEAM" "PROFILE_NAME:$PROFILE_NAME"; do
            key=${pair%%:*}
            val=${pair#*:}
            if [ -z "$val" ]; then echo "缺少 Secret: $key"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: 导入签名证书
        if: inputs.signing == 'development'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_PASSWORD }}

      - name: 安装描述文件
        if: inputs.signing == 'development'
        env:
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/QuickRemind.mobileprovision"

      - name: 归档并导出签名 IPA
        if: inputs.signing == 'development'
        env:
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.quickremind.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -project QuickRemind.xcodeproj \
            -scheme QuickRemind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/QuickRemind.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_ENTITLEMENTS=QuickRemind/QuickRemind.unsigned.entitlements \
            archive
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/QuickRemind.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/export" \
            -exportOptionsPlist exportOptions.plist
          mv "$GITHUB_WORKSPACE/export/QuickRemind.ipa" "$GITHUB_WORKSPACE/QuickRemind-signed.ipa"
          ls -lh QuickRemind-signed.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuickRemind-IPA
          path: |
            QuickRemind-unsigned.ipa
            QuickRemind-signed.ipa
          if-no-files-found: error
